# ═══════════════════════════════════════════════════════════════
# Mayor site + Get MiLyfe landing — served by htc-mayor-site (nginx)
# Root docs: /usr/share/nginx/html  (mounted from ../public_html)
#
#   mijaxx.fun      → full campaign site (index.html + pages)
#   get.milyfe.fun  → the Get MiLyfe landing page at the domain root
#
# The Cloudflare tunnel terminates TLS and forwards plain HTTP here,
# passing the original Host header so this server can route by domain.
# ═══════════════════════════════════════════════════════════════

# ─── get.milyfe.fun : landing page lives at the root ─────────────
server {
    listen 80;
    server_name get.milyfe.fun;

    root /usr/share/nginx/html;
    index get-milyfe.html;

    # Serve the landing page for the domain root.
    location = / {
        try_files /get-milyfe.html =404;
    }

    # Allow the pretty path too: get.milyfe.fun/get-milyfe
    location = /get-milyfe {
        try_files /get-milyfe.html =404;
    }

    # Static assets (css/js/images) resolve normally from the shared root.
    location / {
        try_files $uri $uri/ /get-milyfe.html;
    }
}

# ─── mijaxx.fun : the campaign site ──────────────────────────────
# (also the default for any other Host, e.g. direct tunnel URL)
server {
    listen 80 default_server;
    server_name mijaxx.fun www.mijaxx.fun _;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri.html $uri/ =404;
    }
}
